name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Check URL consistency
        run: python3 -m unittest discover -s tests

      - name: Prepare canonical links for publication
        run: python3 scripts/prepare_site.py --output "${{ runner.temp }}/land-en-zee-site"

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ runner.temp }}/land-en-zee-site
          branch: gh-pages
